version: 0.5.2+148
environment:
  sdk: ^3.10.8

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  cached_network_image: ^3.4.1
  # Picking a profile photograph. It was in dev_dependencies, which is not
  # where a release build looks -- the same trap as the five packages in 0020.
  image_picker: ^1.1.2
  # Reads the version for the About dialog. Here and not in dev_dependencies
  # for the same reason image_picker is: a plugin declared there has no native
  # side registered in a release build, so it throws in release and nowhere
  # else -- the one place it is hardest to notice.
  package_info_plus: ^9.0.0
  carousel_slider: ^5.0.0
  country_code_picker: ^3.1.0
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  equatable: ^2.0.7
  supabase_flutter: ^2.12.0

  # Firebase. firebase_core is what firebase_options.dart imports, and it was
  # only resolving because firebase_analytics happened to bring it along --
  # a package imported by lib/ belongs here in its own right, or the day
  # analytics is dropped the build breaks for a reason nobody will connect
  # to it. firebase_messaging is the one that actually delivers a
  # notification; analytics only counts things.
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  # Draws the notification itself while the app is open. Android hands a
  # message to the app rather than showing it when the app is in the
  # foreground, so without this a patient who books and stays on the screen
  # sees nothing and concludes notifications are broken.
  flutter_local_notifications: ^21.0.0
  firebase_analytics: ^12.0.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1

  flutter_svg: ^2.0.13
  get_it: ^9.2.0
  google_maps_flutter: ^2.10.0
  google_places_flutter: ^2.1.0
  intl: ^0.20.2
  pin_code_fields: ^9.1.0
  readmore: ^3.0.0
  share_plus: ^12.0.0
  shimmer: ^3.0.0
  go_router: ^17.1.0
  modal_progress_hud_nsn: ^0.5.1
  flutter_markdown: ^0.7.7+1

  # Imported directly by lib/, so declared here rather than relied on through
  # another package or left in dev_dependencies, which is not where a release
  # build looks. flutter_secure_storage holds the session token; without it the
  # app cannot tell whether anyone is signed in.
  bloc: ^9.0.0
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  path_provider: ^2.0.0
  shared_preferences: ^2.5.3



dev_dependencies:
  device_user_agent: ^0.1.2
  dio: ^5.7.0
  flutter_dotenv: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0
  flutter_localization: ^0.3.3
  flutter_slidable: ^4.0.0
  flutter_spinkit: ^5.2.1
  flutter_test:
    sdk: flutter
  geocoding: ^4.0.0
  geolocator: ^14.0.1
  jwt_decoder: ^2.0.1
  location: ^8.0.0
  logger: ^2.5.0
  myfatoorah_flutter: ^3.2.4
  permission_handler: ^11.3.1
  sentry_dart_plugin: ^3.1.1
  sentry_flutter: ^9.6.0
  smooth_page_indicator: ^2.0.1
  timer_count_down: ^2.2.2
  toastification: ^3.0.2
  toggle_switch: ^2.3.0
  ua_client_hints: ^1.4.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter packages.
flutter:
  generate: true
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter packages.


  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    # The licence ships with the font because the licence says it must, and
    # because main.dart reads it to put Tajawal on the app's licences page.
    - assets/fonts/OFL.txt
  # Bundled rather than fetched: every TextStyle in the app already named
  # Tajawal, and nothing shipped it -- so the font fell back to whatever the
  # phone happened to have and the app looked like a different app on every
  # handset. Shipping the files also means it renders with no connection at
  # all, which a font served from the network does not.
  #
  # w600 has no file of its own: Tajawal has no SemiBold, and Flutter picks the
  # nearest weight it does have.
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
flutter_assets:
  assets_path: assets/images
  output_path: lib/core/utils
  filename: app_images.dart
  field_prefix:
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
flutter_intl:
  enabled: true

