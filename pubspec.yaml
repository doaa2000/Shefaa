# The launcher icon, generated from one source image for every size Android and
# iOS ask for. Run after changing the source:
#
#   flutter pub get
#   dart run flutter_launcher_icons
#
# Two images, not one, and the difference matters:
#
#   image_path               is used as-is for iOS and for older Android. The
#                            mark should fill most of the square -- iOS rounds
#                            the corners itself and adds no padding, so wide
#                            margins baked into the file make the logo look
#                            small beside every other app on the home screen.
#
#   adaptive_icon_foreground is cropped by the launcher into whatever shape the
#                            handset uses -- circle, squircle, teardrop. Only
#                            the middle 66% is guaranteed to survive, so this
#                            one wants the generous margin the other does not.
#
# The background is the white the logo was drawn on.
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  ios: true
  # iOS rejects an icon with an alpha channel, so it is flattened onto white
  # here rather than left to fail at submission.
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  web:
    generate: true
    background_color: "#FFFFFF"
    theme_color: "#67B2D8"
